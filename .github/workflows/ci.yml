name: Infrastructure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          github_token: ""
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version_file: .tool-versions

      - name: Format
        run: tofu fmt -check -recursive

      - name: Reject IPv4 literals in Terraform source
        shell: bash
        run: |
          if find . -type f -name '*.tf' ! -path '*/tests/*' ! -path '*/.terraform/*' -print0 |
            xargs -0 -r grep -nHE '(^|[^0-9])([0-9]{1,3}\.){3}[0-9]{1,3}([^0-9]|$)'; then
            echo "IPv4 literals must not be committed in Terraform source."
            exit 1
          fi

      - name: Initialize and validate stacks
        shell: bash
        run: |
          for stack in stacks/*/*; do
            [ -d "$stack" ] || continue
            tofu -chdir="$stack" init -backend=false -input=false
            tofu -chdir="$stack" validate
          done

      - name: Initialize and test modules
        shell: bash
        run: |
          for module in modules/* providers/*/*; do
            [ -d "$module" ] || continue
            tofu -chdir="$module" init -backend=false -input=false
            tofu -chdir="$module" test
          done

      - name: Lint
        run: tflint --recursive
