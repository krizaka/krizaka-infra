# Read-only plan of the family's DNS (stacks/dns) against the live Porkbun zones. It never applies (AGENTS.md « Never apply »).
# On a pull request it must say « 0 to add, 0 to change, 0 to destroy » unless the pull request changes a record on purpose.
# Every day it is also the drift check: when the live DNS differs from the code, it fails and opens (or updates) one issue.
name: DNS plan

on:
  pull_request:
    paths:
      - "stacks/dns/**"
      - "modules/dns/**"
      - "providers/porkbun/**"
      - "scripts/dns-plan.sh"
      - ".github/workflows/dns-plan.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan (read-only)
    # A pull request from a fork gets no secret: the plan runs for branches of this repository only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
      PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OpenTofu version from .tool-versions
        id: versions
        run: echo "tofu=$(awk '$1=="opentofu"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.versions.outputs.tofu }}
          tofu_wrapper: false
      - name: Plan (read-only)
        id: plan
        run: |
          set +e
          ./scripts/dns-plan.sh 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          { echo '### DNS plan'; echo '```'; head -n 45 "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Open or update the drift issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="DNS drift: the live DNS differs from stacks/dns"
          body=$(printf 'The scheduled DNS plan failed (exit code %s): %s\n\n```\n%s\n```\n\nEither a record was changed by hand at Porkbun (put it in code, in a pull request, or undo it), or the plan itself could not run (read the log). Nothing here applies anything.' \
            "${{ steps.plan.outputs.code }}" "$RUN_URL" "$(head -n 40 "$RUNNER_TEMP/plan.txt")")
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
